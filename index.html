<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestral Puebloan City Engine (c. 1150–1300 CE)</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div class="header">
            <h1>Ancestral Puebloan Settlement</h1>
            <p>Pueblo III Period (High Desert Canyon Recess)</p>
        </div>
        
        <div class="controls-card">
            <h3>Environment & Hydraulics</h3>
            <div class="button-group">
                <button id="btn-sunlight">Toggle Lighting Mode</button>
                <button id="btn-water">Flow Water Canals</button>
            </div>
            <div class="info-metrics">
                <div><span>Elevation:</span> 2,100 m</div>
                <div><span>Hydraulic Flow:</span> Active</div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
